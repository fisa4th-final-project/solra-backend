spring:
    application:
        name: solra

    datasource:
        url: ${SPRING_DB_URL}
        username: ${SPRING_DB_USERNAME}
        password: ${SPRING_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate.format_sql: true

    session:
        store-type: redis
        timeout: 1800s
    data:
        redis:
            host: 34.64.216.178
            port: 6379

jwt:
    secret: ${SPRING_JWT_SECRET}
    expiration: ${SPRING_JWT_EXPIRATION}

server:
    port: 8080