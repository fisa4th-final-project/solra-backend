spring:
    application:
        name: solra

    datasource:
        url: ${SPRING_DB_URL}
        username: ${SPRING_DB_USERNAME}
        password: ${SPRING_DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate.format_sql: true

    session:
        store-type: redis
        timeout: 1800s
    data:
        redis:
            cluster:
                nodes:
                    - redis-0.redis.redis.svc.cluster.local:6379
                    - redis-1.redis.redis.svc.cluster.local:6379
                    - redis-2.redis.redis.svc.cluster.local:6379
                    - redis-3.redis.redis.svc.cluster.local:6379
                    - redis-4.redis.redis.svc.cluster.local:6379
                    - redis-5.redis.redis.svc.cluster.local:6379
            timeout: 3000

jwt:
    secret: ${SPRING_JWT_SECRET}
    expiration: ${SPRING_JWT_EXPIRATION}

server:
    port: 8080