apiVersion: apps/v1
kind: Deployment
metadata:
  name: solra-backend
  labels:
    app: solra-backend
    kube-monkey/enabled: "true"
    kube-monkey/identifier: "solra-backend-1"
    kube-monkey/mtbf: "1"
    kube-monkey/kill-mode: "fixed"
    kube-monkey/kill-value: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: solra-backend
  template:
    metadata:
      labels:
        app: solra-backend
        kube-monkey/enabled: "true"
        kube-monkey/identifier: "solra-backend-1"
        kube-monkey/mtbf: "1"
        kube-monkey/kill-mode: "fixed"
        kube-monkey/kill-value: "1"
    spec:
      containers:
        - name: solra-backend
          image: ghcr.io/fisa4th-final-project/solra-backend
          envFrom:
            - secretRef:
                name: solra-backend-secret
